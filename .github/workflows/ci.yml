name: Tubería Automatizada de Web Scraping y Calidad (CI)

on:
  push:
    branches: [ "main" ]

jobs:
  extraccion-y-calidad:
    name: Extraer, Probar y Guardar Dataset
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # PASO DE CALIDAD: Ejecución de Pruebas Automáticas
      - name: Ejecutar pruebas unitarias con Pytest
        run: |
          pytest -v tests/

      # PASO DE SEGURIDAD Y PERSISTENCIA: Autenticación segura mediante Secrets
      - name: Guardar dataset actualizado en el repositorio
        env:
          TOKEN_SECRET: ${{ secrets.PAT_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/productos_extraidos.csv
          git commit -m "auto(data): actualización automática del dataset de productos" || exit 0
          git push https://${TOKEN_SECRET}@github.com/${{ github.repository }}.git main
